[build-system]
requires = ["hatchling>=1.24", "hatch-vcs>=0.4"]
build-backend = "hatchling.build"

[project]
name = "http-api-tool"
description = "A Python HTTP/HTTPS API testing tool for GitHub Actions and CLI usage"
readme = "README.md"
license = {text = "Apache-2.0"}
authors = [
    {name = "Matthew Watkins", email = "93649628+ModeSevenIndustrialSolutions@users.noreply.github.com"},
]
maintainers = [
    {name = "Matthew Watkins", email = "93649628+ModeSevenIndustrialSolutions@users.noreply.github.com"},
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Software Development :: Testing",
    "Topic :: System :: Monitoring",
    "Topic :: Utilities",
]
keywords = [
    "http",
    "api",
    "testing",
    "verification",
    "github-actions",
    "curl",
    "monitoring",
    "health-check",
]
requires-python = ">=3.10"
dependencies = [
    "pycurl>=7.45.0",
    "typer>=0.9.0",
    "certifi>=2025.6.15",
    "requests>=2.32.4",
]
dynamic = ["version"]

[project.optional-dependencies]
test = [
    "pytest>=8.0.0",
    "pytest-cov>=6.2.1",
    "requests>=2.32.4",
    "responses>=0.25.0",
    "coverage[toml]>=7.9.1",
]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=6.2.1",
    "black>=24.0.0",
    "isort>=5.13.0",
    "flake8>=7.0.0",
    "bandit>=1.8.0",
    "pre-commit>=4.0.0",
    "mypy>=1.11.0",
    "coverage[toml]>=7.9.1",
    "interrogate>=1.5.0",
]

[project.urls]
Homepage = "https://github.com/lfreleng-actions/http-api-tool-docker"
Repository = "https://github.com/lfreleng-actions/http-api-tool-docker"
Documentation = "https://github.com/lfreleng-actions/http-api-tool-docker/blob/main/README.md"
"Bug Tracker" = "https://github.com/lfreleng-actions/http-api-tool-docker/issues"

[project.scripts]
http-api-tool = "http_api_tool:main"

[tool.hatch.version]
source = "vcs"

[tool.hatch.version.raw-options]
local_scheme = "no-local-version"

[tool.hatch.build.hooks.vcs]
version-file = "src/http_api_tool/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/http_api_tool"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--strict-markers",
    "--strict-config",
    "--verbose",
    "--cov",
    "--cov-report=html"
]
markers = [
    "integration: marks tests as integration tests (deselect with '-m \"not integration\"')",
    "unit: marks tests as unit tests",
]

[tool.coverage.run]
# Keep the transient coverage database out of the working tree.
# coverage.py resolves a relative data_file against the current
# directory, so the default '.coverage' lands wherever pytest runs and
# can be picked up by tests that inspect on-disk content. TEMP is
# set on Windows, where /tmp does not exist; elsewhere it is normally
# unset and the /tmp fallback applies. An explicit value also
# satisfies python-test-action's data_file configuration check.
# COVERAGE_FILE (env) still takes precedence when set.
data_file = "${TEMP-/tmp}/.coverage.http-api-tool-docker"
source = ["http_api_tool"]
omit = [
    "*/tests/*",
    "*/test_*",
    "*/__pycache__/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]
show_missing = true
precision = 2

[tool.coverage.html]
directory = "coverage_html_report"

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true

[[tool.mypy.overrides]]
module = ["pycurl"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["http_api_tool.cli"]
disallow_untyped_decorators = false

[tool.bandit]
exclude_dirs = ["tests"]
skips = ["B101", "B601"]

[tool.interrogate]
ignore-init-method = true
ignore-init-module = false
ignore-magic = false
ignore-semiprivate = false
ignore-private = false
ignore-property-decorators = false
ignore-module = false
ignore-nested-functions = false
ignore-nested-classes = true
ignore-setters = false
fail-under = 80
exclude = ["setup.py", "docs", "build", "tests"]
ignore-regex = ["^get$", "^mock_.*", "^dummy_.*"]
verbose = 0
quiet = false
whitelist-regex = []
color = true
omit-covered-files = false

[tool.basedpyright]
pythonVersion = "3.10"
typeCheckingMode = "standard"
reportMissingImports = "warning"
reportUninitializedInstanceVariable = "warning"

# Pin the ruff rule set explicitly.
#
# Without a `select`, ruff applies its *default* rule set, and that
# default is not stable across releases:
#
#     ruff 0.15.22 ->  59 rules across  2 categories (E, F)
#     ruff 0.16.0  -> 413 rules across 38 categories
#
# A routine pre-commit autoupdate crossing that boundary changed which
# rules run and broke repositories across this organisation, on code
# nobody had touched.
#
# The selection below is deliberately narrow: it is exactly the rule set
# this repository already satisfies, so pinning changes no behaviour
# today. Widening it to the organisation superset
# ("E", "W", "F", "I", "B", "C4", "UP") is worthwhile but is a code
# change, not a configuration one: it currently reports 22 findings,
# 14 of them auto-fixable, with 6 B904 (raise-without-from) needing
# review by hand. That belongs in its own reviewed pull request rather
# than riding along with a version bump.
#
# Note that this pins the rule set at CATEGORY level, not rule level.
# Ruff selectors are prefixes, so a future release adding new E* or F*
# rules would enable them here automatically. Pinning every rule code
# individually would be exhaustive and unmaintainable; the aim is to
# bound the blast radius, reducing "413 rules across 38 categories"
# back to two, not to freeze the set outright.
#
# `line-length` and `target-version` are intentionally left unset so
# ruff's own defaults continue to apply unchanged.

[tool.ruff.lint]
select = ["E", "F"]

ignore = [
  "E501", # line-too-long: the formatter owns line length
]

[tool.ruff.lint.per-file-ignores]
# Test suites legitimately break rules that matter in library code.
#
# None of these codes is reachable under the current `select`, and only
# B-prefixed ones would be reachable under the organisation superset.
# They are listed anyway so that a later widening beyond that superset,
# to "S", "ARG" or "PL", does not immediately flag every test module.
# PLR0917 is the concrete case already seen elsewhere: tests stacking
# @patch decorators cannot satisfy it, because unittest.mock injects
# its mocks positionally, so a keyword-only signature is impossible
# rather than merely inconvenient.
"tests/**/*.py" = ["S101", "ARG", "PLR0913", "PLR0917", "PLR2004"]
