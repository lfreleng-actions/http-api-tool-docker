version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 15
    commit-message:
      prefix: "Chore"
    cooldown:
      default-days: 7
      # Our own organisation's actions and reusable workflows skip the
      # cooldown: we review those releases ourselves, and their fixes
      # need to reach callers without a week's delay.
      exclude:
        - "lfreleng-actions/*"
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    commit-message:
      prefix: "Chore"
    cooldown:
      default-days: 7
