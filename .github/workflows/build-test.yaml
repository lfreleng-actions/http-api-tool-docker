---
# SPDX-License-Identifier: Apache-2.0
# SPDX-FileCopyrightText: 2025 The Linux Foundation

name: 'Build/Test and Publish Docker Image'

# yamllint disable-line rule:truthy
on:
  workflow_dispatch:
    inputs:
      bust_cache:
        description: 'Bust Docker build cache (forces fresh build)'
        required: false
        type: boolean
        default: false
  push:
    branches: [ 'main' ]
  pull_request:
    branches: [ 'main' ]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  # yamllint disable-line rule:line-length
  HARDEN_RUNNER_ALLOWLIST: 'lfreleng-actions//.github/harden-runner/lfreleng-actions/allow_list.txt@6d4a65c5601afd6c2fbe52bda4b0024b132f265d'  # v0.19.0

jobs:
  # Python build, tests, dependency audit, SBOM and Grype scan come
  # from the python-workflows family
  python-build-test:
    name: 'Python Build/Test'
    permissions:
      contents: read
      pull-requests: read  # repository-metadata-action queries PR data
    # yamllint disable-line rule:line-length
    uses: lfreleng-actions/python-workflows/.github/workflows/build-test.yaml@d9336718eea42197699c233134f3b34a69520012  # v0.7.0
    with:
      # Grype policy: findings block only when the change touched a
      # dependency file; gate on fixable findings in declared
      # dependencies from medium up and on critical transitive ones
      grype_gate_when: 'dependencies-changed'
      grype_only_fixed: true
      grype_dependency_policy: 'declared'
      grype_transitive_fail_on: 'critical'
      # The NO_BLOCK_AUDIT_FAIL repository variable lets the lane pass
      # a failing dependency audit, as on the release lane
      audit_permit_fail: ${{ vars.NO_BLOCK_AUDIT_FAIL == 'true' }}

  # Container build, smoke test, hadolint, image SBOM and Grype scan
  # come from the docker-workflows family. The image list is explicit
  # because discovery looks for a Dockerfile, not docker/Containerfile.
  docker-build-test:
    name: 'Docker Build/Test'
    permissions:
      contents: read
      pull-requests: read  # repository-metadata-action queries PR data
    # yamllint disable-line rule:line-length
    uses: lfreleng-actions/docker-workflows/.github/workflows/build-test.yaml@dfb21cf08232d24154ac19a178c9accc5bfb7877  # v0.12.0
    with:
      # yamllint disable-line rule:line-length
      images: '[{"name": "http-api-tool-docker", "context": ".", "dockerfile": "docker/Containerfile", "build_args": ["VERSION=0.0.0.dev0"]}]'
      test_command: 'docker run --rm http-api-tool-docker:verify --help'
      # Grype policy: findings block only when the change touched the
      # Containerfile or a Python dependency file, which the image
      # installs. An image SBOM carries no dependency graph, so every
      # finding counts as declared and the policy is 'all'
      grype_gate_when: 'dependencies-changed'
      grype_dependency_ecosystems: 'docker,python'
      grype_dependency_policy: 'all'
      grype_only_fixed: true
      # The Debian base image always carries findings with no published
      # fix; only_fixed reports those without gating, and the gate
      # fails on fixable critical findings
      grype_fail_on: 'critical'
      # Both family calls run in parallel and share the Grype database
      # cache prefix, whose keys rotate on the database build time, so
      # one job at most may save it. The Python call has no cache mode
      # input and always saves; this call restores without saving.
      grype_cache_db: 'restore-only'

  # Integration tests
  integration-tests:
    name: "Integration Tests"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - name: 'Load egress allow-list (block mode)'
        # yamllint disable-line rule:line-length
        uses: lfreleng-actions/harden-runner-block-action@36a02f4a61b27e7a0a91e1df2134abe9545cf54e  # v0.16.1
        with:
          config: ${{ env.HARDEN_RUNNER_ALLOWLIST }}
          allow_list_summary: 'false'

      - name: 'Harden runner (block)'
        # yamllint disable-line rule:line-length
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43  # v2.22.3
        with:
          egress-policy: 'block'
          allowed-endpoints: >
            ${{ env.CONNECTION_ALLOW_LIST }}

      # Set up go-httpbin for testing
      - name: Setup go-httpbin HTTPS service
        uses: lfreleng-actions/go-httpbin-action@692bf3b759b746041e9cc2eebec5a6006e6d6041  # v0.1.7
        id: go-httpbin
        with:
          debug: 'true'
          port: '8080'

      # Test 1: Basic GET request
      - name: Test Basic GET request
        uses: $/
        with:
          url: 'https://${{ steps.go-httpbin.outputs.host-gateway-ip }}:8080/get'
          ca_bundle_path: '${{ steps.go-httpbin.outputs.ca-cert-path }}'
          debug: true
          expected_http_code: 200

      # Test 2: POST request with JSON
      - name: Test POST request with JSON
        uses: $/
        with:
          url: 'https://${{ steps.go-httpbin.outputs.host-gateway-ip }}:8080/post'
          http_method: 'POST'
          request_body: '{"test": "data", "number": 42}'
          content_type: 'application/json'
          ca_bundle_path: '${{ steps.go-httpbin.outputs.ca-cert-path }}'
          debug: true
          expected_http_code: 200

      # Test 3: Custom headers
      - name: Test Custom headers
        uses: $/
        with:
          url: 'https://${{ steps.go-httpbin.outputs.host-gateway-ip }}:8080/headers'
          request_headers: '{"X-Test-Header": "test-value", "X-API-Key": "secret123"}'
          ca_bundle_path: '${{ steps.go-httpbin.outputs.ca-cert-path }}'
          debug: true
          expected_http_code: 200

      # Test 4: Error handling (404)
      - name: Test Error handling (404)
        uses: $/
        with:
          url: 'https://${{ steps.go-httpbin.outputs.host-gateway-ip }}:8080/status/404'
          ca_bundle_path: '${{ steps.go-httpbin.outputs.ca-cert-path }}'
          debug: true
          expected_http_code: 404

      # Test 5: Error handling (500)
      - name: Test Error handling (500)
        uses: $/
        with:
          url: 'https://${{ steps.go-httpbin.outputs.host-gateway-ip }}:8080/status/500'
          ca_bundle_path: '${{ steps.go-httpbin.outputs.ca-cert-path }}'
          debug: true
          expected_http_code: 500

      # Clean up is handled automatically by the go-httpbin action

  # Publish to GHCR only after the Python build, tests, audit and Grype
  # gates, the image build and the integration tests all pass
  docker-publish:
    name: "Publish to GHCR"
    runs-on: ubuntu-latest
    needs: [python-build-test, docker-build-test, integration-tests]
    if: github.event_name != 'pull_request'
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write  # Push container images to GHCR

    steps:
      - name: 'Load egress allow-list (block mode)'
        # yamllint disable-line rule:line-length
        uses: lfreleng-actions/harden-runner-block-action@36a02f4a61b27e7a0a91e1df2134abe9545cf54e  # v0.16.1
        with:
          config: ${{ env.HARDEN_RUNNER_ALLOWLIST }}
          allow_list_summary: 'false'

      - name: 'Harden runner (block)'
        # yamllint disable-line rule:line-length
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43  # v2.22.3
        with:
          egress-policy: 'block'
          allowed-endpoints: >
            ${{ env.CONNECTION_ALLOW_LIST }}

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Set up Docker Buildx
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # Login to GitHub Container Registry
      - name: Login to Container Registry
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6  # v4.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Extract metadata for tags and labels
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}
          labels: |
            org.opencontainers.image.title=HTTP API Tool
            org.opencontainers.image.description=A Python HTTP/HTTPS API testing tool for GitHub Actions and CLI usage
            org.opencontainers.image.vendor=The Linux Foundation

      # Build and push image with comprehensive caching
      - name: Build and push Docker image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./docker/Containerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=0.0.0.dev0
          # yamllint disable rule:line-length
          cache-from: |
            ${{ github.event_name == 'workflow_dispatch' && inputs.bust_cache == true && 'type=gha,scope=docker-publish-never-exists' || 'type=gha,scope=docker-publish' }}
            type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:cache-base
            type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:cache-deps
          # yamllint enable rule:line-length
          no-cache: ${{ github.event_name == 'workflow_dispatch' && inputs.bust_cache == true }}
          cache-to: |
            type=gha,mode=max,scope=docker-publish
            type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:cache-base,mode=max
            type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:cache-deps,mode=max

      - name: Verify published image
        run: |
          echo "Image published successfully to GHCR"
          echo "Tags: ${STEPS_META_OUTPUTS_TAGS}"
        env:
          STEPS_META_OUTPUTS_TAGS: ${{ steps.meta.outputs.tags }}

  # CLI integration tests (after container pipeline)
  cli-tests:
    name: 'CLI Integration Tests'
    runs-on: ubuntu-latest
    needs: [integration-tests]
    permissions:
      contents: read
    timeout-minutes: 15
    steps:
      - name: 'Load egress allow-list (block mode)'
        # yamllint disable-line rule:line-length
        uses: lfreleng-actions/harden-runner-block-action@36a02f4a61b27e7a0a91e1df2134abe9545cf54e  # v0.16.1
        with:
          config: ${{ env.HARDEN_RUNNER_ALLOWLIST }}
          allow_list_summary: 'false'

      - name: 'Harden runner (block)'
        # yamllint disable-line rule:line-length
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43  # v2.22.3
        with:
          egress-policy: 'block'
          allowed-endpoints: >
            ${{ env.CONNECTION_ALLOW_LIST }}

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install UV
        # yamllint disable-line rule:line-length
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock

      - name: Install project dependencies
        run: |
          uv sync --extra test

      - name: Test CLI help and version
        run: |
          # Test CLI help
          uv run python -m http_api_tool --help

          # Test specific command help
          uv run python -m http_api_tool test --help

      # Start go-httpbin service for testing
      - name: Setup go-httpbin service
        id: go-httpbin
        uses: lfreleng-actions/go-httpbin-action@692bf3b759b746041e9cc2eebec5a6006e6d6041  # v0.1.7
        with:
          port: '8080'
          debug: 'true'

      - name: Test CLI with various scenarios
        run: |
          # Use the HTTPS service URL and CA bundle from the go-httpbin action
          SERVICE_URL="${STEPS_GO_HTTPBIN_OUTPUTS_SERVICE_URL}"
          CA_BUNDLE="${STEPS_GO_HTTPBIN_OUTPUTS_CA_CERT_PATH}"

          echo "Testing with service URL: $SERVICE_URL"
          echo "Using CA bundle: $CA_BUNDLE"

          # Test basic GET request
          uv run python -m http_api_tool test \
            --url "$SERVICE_URL/get" \
            --http-method GET \
            --expected-http-code 200 \
            --ca-bundle-path "$CA_BUNDLE" \
            --debug \
            --retries 3

          # Test POST request with JSON
          uv run python -m http_api_tool test \
            --url "$SERVICE_URL/post" \
            --http-method POST \
            --expected-http-code 200 \
            --request-body '{"test": "data"}' \
            --content-type "application/json" \
            --ca-bundle-path "$CA_BUNDLE" \
            --debug

          # Test with headers
          uv run python -m http_api_tool test \
            --url "$SERVICE_URL/headers" \
            --http-method GET \
            --expected-http-code 200 \
            --request-headers '{"X-Custom-Header": "test-value"}' \
            --ca-bundle-path "$CA_BUNDLE" \
            --debug

          # Test with authentication (if supported)
          uv run python -m http_api_tool test \
            --url "$SERVICE_URL/basic-auth/user/pass" \
            --http-method GET \
            --expected-http-code 401 \
            --ca-bundle-path "$CA_BUNDLE" \
            --debug || echo "Expected 401 for unauth request"
        env:
          STEPS_GO_HTTPBIN_OUTPUTS_SERVICE_URL: ${{ steps.go-httpbin.outputs.service-url }}
          STEPS_GO_HTTPBIN_OUTPUTS_CA_CERT_PATH: ${{ steps.go-httpbin.outputs.ca-cert-path }}

      - name: Test CLI error handling
        run: |
          # Test with invalid URL (should fail gracefully)
          uv run python -m http_api_tool test \
            --url "https://localhost:9999/nonexistent" \
            --http-method GET \
            --expected-http-code 200 \
            --retries 1 \
            --debug || echo "Expected failure for invalid URL"

      - name: Clean up test containers
        if: always()
        run: |
          docker rm -f go-httpbin || true

  # GitHub Action functionality tests (after container pipeline)
  action-tests:
    name: 'GitHub Action Tests'
    runs-on: ubuntu-latest
    needs: [integration-tests]
    permissions:
      contents: read
    timeout-minutes: 10
    steps:
      - name: 'Load egress allow-list (block mode)'
        # yamllint disable-line rule:line-length
        uses: lfreleng-actions/harden-runner-block-action@36a02f4a61b27e7a0a91e1df2134abe9545cf54e  # v0.16.1
        with:
          config: ${{ env.HARDEN_RUNNER_ALLOWLIST }}
          allow_list_summary: 'false'

      - name: 'Harden runner (block)'
        # yamllint disable-line rule:line-length
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43  # v2.22.3
        with:
          egress-policy: 'block'
          allowed-endpoints: >
            ${{ env.CONNECTION_ALLOW_LIST }}

      # Start go-httpbin service for testing
      - name: Setup go-httpbin service
        id: go-httpbin
        uses: lfreleng-actions/go-httpbin-action@692bf3b759b746041e9cc2eebec5a6006e6d6041  # v0.1.7
        with:
          port: '8080'
          debug: 'true'

      - name: Test GitHub Action (local)
        uses: $/
        with:
          url: '${{ steps.go-httpbin.outputs.service-url }}/get'
          service_name: 'HTTPBin Test Service'
          expected_http_code: 200
          retries: 3
          initial_sleep_time: 1
          ca_bundle_path: '${{ steps.go-httpbin.outputs.ca-cert-path }}'

      - name: Test GitHub Action with POST
        uses: $/
        with:
          url: '${{ steps.go-httpbin.outputs.service-url }}/post'
          service_name: 'HTTPBin POST Test'
          http_method: 'POST'
          expected_http_code: 200
          request_body: '{"test": "data"}'
          content_type: 'application/json'
          ca_bundle_path: '${{ steps.go-httpbin.outputs.ca-cert-path }}'

      - name: Test GitHub Action error handling
        uses: $/
        continue-on-error: true
        with:
          url: 'https://localhost:9999/nonexistent'
          service_name: 'Non-existent Service'
          expected_http_code: 200
          retries: 1

      - name: Clean up test containers
        if: always()
        run: |
          docker rm -f go-httpbin || true

  # Test deployment modes (uvx vs docker) to verify localhost URL handling
  deployment-mode-tests:
    name: 'Deployment Mode Tests'
    runs-on: ubuntu-latest
    needs: [integration-tests]
    permissions:
      contents: read
    timeout-minutes: 10
    steps:
      - name: 'Load egress allow-list (block mode)'
        # yamllint disable-line rule:line-length
        uses: lfreleng-actions/harden-runner-block-action@36a02f4a61b27e7a0a91e1df2134abe9545cf54e  # v0.16.1
        with:
          config: ${{ env.HARDEN_RUNNER_ALLOWLIST }}
          allow_list_summary: 'false'

      - name: 'Harden runner (block)'
        # yamllint disable-line rule:line-length
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43  # v2.22.3
        with:
          egress-policy: 'block'
          allowed-endpoints: >
            ${{ env.CONNECTION_ALLOW_LIST }}

      # Start go-httpbin service for testing
      - name: Setup go-httpbin service
        id: go-httpbin
        uses: lfreleng-actions/go-httpbin-action@692bf3b759b746041e9cc2eebec5a6006e6d6041  # v0.1.7
        with:
          port: '8080'
          debug: 'true'
          skip-readiness-check: 'true'

      - name: Get service URL and prepare test URLs
        id: test-urls
        run: |
          # Get the gateway IP URL from go-httpbin
          GATEWAY_URL="${STEPS_GO_HTTPBIN_OUTPUTS_SERVICE_URL}"
          echo "Gateway URL from action: $GATEWAY_URL"

          # For docker mode, we can use the gateway URL directly
          echo "gateway-url=${GATEWAY_URL}" >> "$GITHUB_OUTPUT"
          echo "Gateway URL for docker tests: $GATEWAY_URL"

          # For uvx mode, construct a 127.0.0.1 URL since uvx runs on host
          # Extract the protocol (https://)
          PROTOCOL="${GATEWAY_URL%%://*}"
          # Extract everything after the IP (port and path)
          SUFFIX="${GATEWAY_URL#*:*:}"
          # Construct 127.0.0.1 URL for host-based testing
          HOST_URL="${PROTOCOL}://127.0.0.1:${SUFFIX}"
          echo "host-url=${HOST_URL}" >> "$GITHUB_OUTPUT"
          echo "Host URL for uvx tests: $HOST_URL"
          echo "✅ Prepared test URLs for both deployment modes"
        env:
          STEPS_GO_HTTPBIN_OUTPUTS_SERVICE_URL: ${{ steps.go-httpbin.outputs.service-url }}

      # setup-uv in the action must neither start an interpreter from the
      # caller's workspace nor read its uv settings. Each planted
      # interpreter records that it ran, and the uv.toml's
      # required-version would fail the action.
      - name: Plant interpreters and uv settings in the workspace
        run: |
          set -euo pipefail
          marker="$RUNNER_TEMP/planted-ran"
          stub() {
            # $0 and $* expand when the stub runs, not here.
            # shellcheck disable=SC2016
            printf '#!/bin/sh\necho "%s: $0 $*" >> "%s"\nexit 1\n' \
              "$1" "$marker" > "$2"
            chmod +x "$2"
          }
          mkdir -p .venv/bin planted
          printf 'home = /usr/bin\nversion_info = 3.12.0\n' > .venv/pyvenv.cfg
          stub venv .venv/bin/python3
          stub venv .venv/bin/python
          stub python-version planted/python3
          echo "$GITHUB_WORKSPACE/planted/python3" > .python-version
          printf '%s\n' 'cache-dir = "/nonexistent/planted-cache"' \
            'required-version = "==0.0.1"' > uv.toml

      - name: Test uvx deployment with host URL
        id: uvx-get
        uses: $/
        with:
          deploy: 'uvx'
          url: '${{ steps.test-urls.outputs.host-url }}/get'
          service_name: 'UVX Deployment Test'
          expected_http_code: 200
          retries: 3
          initial_sleep_time: 1
          verify_ssl: 'false'
          debug: 'true'

      - name: Verify uvx deployment success
        run: |
          echo "✅ UVX mode successfully connected using host-based URL (127.0.0.1)"
          echo "UVX runs on the host, so it can access services via loopback interface"

      - name: Test docker deployment with gateway URL
        uses: $/
        with:
          deploy: 'docker'
          url: '${{ steps.test-urls.outputs.gateway-url }}/get'
          service_name: 'Docker Deployment Test'
          expected_http_code: 200
          retries: 3
          initial_sleep_time: 1
          verify_ssl: 'false'
          debug: 'true'

      - name: Verify docker deployment success
        run: |
          echo "✅ Docker mode successfully connected using gateway IP"
          echo "Docker containers use the gateway IP to access host services"


      - name: Test uvx with POST request
        uses: $/
        with:
          deploy: 'uvx'
          url: '${{ steps.test-urls.outputs.host-url }}/post'
          service_name: 'UVX POST Test'
          http_method: 'POST'
          request_body: '{"deployment": "uvx", "test": "host_url"}'
          content_type: 'application/json'
          expected_http_code: 200
          verify_ssl: 'false'
          debug: 'true'

      - name: Check uvx results and that no planted interpreter ran
        env:
          HTTP_CODE: ${{ steps.uvx-get.outputs.response_http_code }}
        run: |
          set -euo pipefail
          marker="$RUNNER_TEMP/planted-ran"
          if [[ -e "$marker" ]]; then
            echo "::error::A planted workspace interpreter ran:"
            cat "$marker"
            exit 1
          fi
          if [[ "$HTTP_CODE" != "200" ]]; then
            echo "::error::Unexpected response_http_code: '$HTTP_CODE'"
            exit 1
          fi
          rm -rf .venv planted .python-version uv.toml

      # The same check with the action checked out inside the workspace
      # ('uses: ./...'), as a caller that vendors it would. The planted
      # files sit in the workspace root, the action directory's parent,
      # where only the step's UV_* settings keep uv from using them.
      - name: Checkout this action into the workspace
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: 'local-action'
          persist-credentials: false

      - name: Plant interpreters and uv settings above the action
        run: |
          set -euo pipefail
          marker="$RUNNER_TEMP/planted-ran"
          stub() {
            # $0 and $* expand when the stub runs, not here.
            # shellcheck disable=SC2016
            printf '#!/bin/sh\necho "%s: $0 $*" >> "%s"\nexit 1\n' \
              "$1" "$marker" > "$2"
            chmod +x "$2"
          }
          mkdir -p .venv/bin planted
          printf 'home = /usr/bin\nversion_info = 3.12.0\n' > .venv/pyvenv.cfg
          stub venv .venv/bin/python3
          stub venv .venv/bin/python
          stub python-version planted/python3
          echo "$GITHUB_WORKSPACE/planted/python3" > .python-version
          printf '%s\n' 'cache-dir = "/nonexistent/planted-cache"' \
            'required-version = "==0.0.1"' > uv.toml

      - name: Test uvx deployment from the workspace copy
        id: uvx-local
        # The local path is the point of this step: '$/' would download
        # the action outside the workspace, as the steps above do.
        uses: ./local-action  # zizmor: ignore[self-repository]
        with:
          deploy: 'uvx'
          url: '${{ steps.test-urls.outputs.host-url }}/get'
          service_name: 'UVX Local Copy Test'
          expected_http_code: 200
          retries: 3
          initial_sleep_time: 1
          verify_ssl: 'false'
          debug: 'true'

      - name: Check the workspace copy and that nothing planted ran
        env:
          HTTP_CODE: ${{ steps.uvx-local.outputs.response_http_code }}
        run: |
          set -euo pipefail
          marker="$RUNNER_TEMP/planted-ran"
          if [[ -e "$marker" ]]; then
            echo "::error::A planted workspace interpreter ran:"
            cat "$marker"
            exit 1
          fi
          if [[ "$HTTP_CODE" != "200" ]]; then
            echo "::error::Unexpected response_http_code: '$HTTP_CODE'"
            exit 1
          fi
          # local-action/ stays: the runner reads its action.yaml again
          # for the post-job cleanup of a local action.
          rm -rf .venv planted .python-version uv.toml

      - name: Verify both deployment modes work
        run: |
          echo "=== Deployment Mode Test Summary ==="
          echo "✅ UVX mode: Successfully connects using host URL (127.0.0.1)"
          echo "✅ Docker mode: Successfully connects using gateway IP"
          echo "✅ Both modes can access services running in Docker containers"
          echo ""
          echo "This test verifies both deployment modes work correctly with different network configurations"

      - name: Clean up test containers
        if: always()
        run: |
          docker rm -f go-httpbin || true

  # A composite action inherits the caller job's environment. An earlier
  # step, such as code from the caller's checkout writing to $GITHUB_ENV,
  # must not be able to make the uvx path run an interpreter or a module
  # of its choosing. Each bait records that it ran in a marker file.
  workspace-isolation:
    name: 'Workspace Isolation'
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
        selector: [request, active-environment]
    steps:
      - name: 'Load egress allow-list (block mode)'
        if: runner.os == 'Linux'
        # yamllint disable-line rule:line-length
        uses: lfreleng-actions/harden-runner-block-action@36a02f4a61b27e7a0a91e1df2134abe9545cf54e  # v0.16.1
        with:
          config: ${{ env.HARDEN_RUNNER_ALLOWLIST }}
          allow_list_summary: 'false'

      - name: 'Harden runner (block)'
        if: runner.os == 'Linux'
        # yamllint disable-line rule:line-length
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43  # v2.22.3
        with:
          egress-policy: 'block'
          allowed-endpoints: >
            ${{ env.CONNECTION_ALLOW_LIST }}

      # A local endpoint, started before any bait exists, so the test
      # needs neither Docker (absent on macOS) nor an external service.
      - name: Start a local HTTP service
        run: |
          set -euo pipefail
          site="$RUNNER_TEMP/isolation-site"
          mkdir -p "$site"
          echo 'isolation test' > "$site/index.html"
          nohup python3 -I -m http.server 8765 --bind 127.0.0.1 \
            --directory "$site" > "$RUNNER_TEMP/isolation-site.log" 2>&1 &
          for _ in $(seq 1 30); do
            if curl -fsS -o /dev/null http://127.0.0.1:8765/; then
              exit 0
            fi
            sleep 1
          done
          echo "::error::The local HTTP service did not start"
          cat "$RUNNER_TEMP/isolation-site.log"
          exit 1

      - name: Plant interpreters, modules and hostile settings
        env:
          SELECTOR: ${{ matrix.selector }}
        run: |
          set -euo pipefail
          marker="$RUNNER_TEMP/isolation-bait-ran"
          ws="$GITHUB_WORKSPACE"
          stub() {
            # $0 and $* expand when the stub runs, not here.
            # shellcheck disable=SC2016
            printf '#!/bin/sh\necho "%s: $0 $*" >> "%s"\nexit 1\n' \
              "$1" "$marker" > "$2"
            chmod +x "$2"
          }
          module() {
            printf 'open(%s, "a").write("import %s\\n")\n' \
              "'$marker'" "$1" > "$2"
          }
          mkdir -p "$ws/.venv/bin" "$ws/.venv/conda-meta" "$ws/xdg-bin"
          for name in python python3 python3.13 uv; do
            stub venv "$ws/.venv/bin/$name"
          done
          printf 'home = /usr/bin\nversion_info = 3.13.0\n' \
            > "$ws/.venv/pyvenv.cfg"
          stub xdg-bin "$ws/xdg-bin/env"
          stub xdg-bin "$ws/xdg-bin/bash"
          for dir in "$ws" "$ws/pkg"; do
            mkdir -p "$dir/urllib"
            for name in json base64 sitecustomize usercustomize; do
              module "$name" "$dir/$name.py"
            done
            module urllib "$dir/urllib/__init__.py"
          done

          case "$(uname -m)" in
            arm64|aarch64) arch=aarch64 ;;
            *) arch=x86_64 ;;
          esac
          # The control step below runs this interpreter against the bait
          echo "CONTROL_PYTHON=$(command -v python3)" >> "$GITHUB_ENV"
          # The runner puts $GITHUB_PATH entries ahead of PATH, as a
          # caller's earlier step would
          echo "$ws/.venv/bin" >> "$GITHUB_PATH"
          {
            echo "PYTHONPATH=pkg:."
            echo "PYTHONHOME=$ws/.venv"
            echo "PYTHONUSERBASE=$ws"
            echo "PYTHONSTARTUP=$ws/json.py"
            echo "PYTHONEXECUTABLE=$ws/.venv/bin/python3"
            echo "__PYVENV_LAUNCHER__=$ws/.venv/bin/python3"
            echo "UV_NO_CACHE=1"
            echo "UV_PYTHON_ARCH=$arch"
            echo "UV_PYTHON_INSTALL_MIRROR=https://127.0.0.1:9"
            echo "XDG_BIN_HOME=$ws/xdg-bin"
            if [ "$SELECTOR" = request ]; then
              echo "UV_PYTHON=$ws/.venv/bin/python3"
              echo "UV_PYTHON_SEARCH_PATH=$ws/.venv/bin"
              echo "UV_PYTHON_INSTALL_DIR=$ws/.uv-python"
              echo "UV_PYTHON_PREFERENCE=only-system"
            else
              # UV_PYTHON stays unset: it would mask this discovery
              echo "VIRTUAL_ENV=$ws/.venv"
              echo "CONDA_PREFIX=$ws/.venv"
              echo "CONDA_DEFAULT_ENV=base"
              echo "UV_INTERNAL__PARENT_INTERPRETER=$ws/.venv/bin/python3"
              echo "UV_INTERNAL__TEST_PYTHON_MANAGED=1"
              echo "UV_CACHE_DIR=$ws/.uv-cache"
            fi
          } >> "$GITHUB_ENV"

      # Proves the bait is live: a Python start that is not isolated
      # runs the planted interpreter, or imports the planted modules.
      - name: Control (the bait runs without isolation)
        run: |
          set -uo pipefail
          marker="$RUNNER_TEMP/isolation-bait-ran"
          python3 -c 'pass' || true
          env -u PYTHONHOME -u PYTHONEXECUTABLE -u __PYVENV_LAUNCHER__ \
            "$CONTROL_PYTHON" -c 'import json' || true
          if ! grep -q '^venv: ' "$marker" 2>/dev/null \
            || ! grep -q '^import json$' "$marker"; then
            echo "::error::The bait did not run; the test proves nothing"
            cat "$marker" 2>/dev/null || true
            exit 1
          fi
          rm -f "$marker"

      - name: Run the action (cold)
        id: run-cold
        uses: $/
        with:
          url: 'http://127.0.0.1:8765/'
          service_name: 'Isolation Test (cold)'
          expected_http_code: 200
          retries: 3

      - name: Run the action (warm)
        id: run-warm
        uses: $/
        with:
          url: 'http://127.0.0.1:8765/'
          service_name: 'Isolation Test (warm)'
          expected_http_code: 200
          retries: 3

      - name: Check that no bait ran and both runs produced outputs
        env:
          COLD_CODE: ${{ steps.run-cold.outputs.response_http_code }}
          WARM_CODE: ${{ steps.run-warm.outputs.response_http_code }}
          COLD_TIME: ${{ steps.run-cold.outputs.total_time }}
          WARM_TIME: ${{ steps.run-warm.outputs.total_time }}
        run: |
          set -euo pipefail
          marker="$RUNNER_TEMP/isolation-bait-ran"
          failed=false
          if [[ -e "$marker" ]]; then
            echo "::error::Planted bait ran:"
            cat "$marker"
            failed=true
          fi
          case ":$PATH:" in
            *":$GITHUB_WORKSPACE/xdg-bin:"*)
              echo "::error::The caller's XDG_BIN_HOME was put on PATH"
              failed=true ;;
          esac
          for run in "cold:$COLD_CODE:$COLD_TIME" "warm:$WARM_CODE:$WARM_TIME"; do
            IFS=: read -r name code time <<< "$run"
            if [[ "$code" != "200" || -z "$time" ]]; then
              echo "::error::The $name run gave response_http_code" \
                "'$code' and total_time '$time'"
              failed=true
            fi
          done
          [[ "$failed" == false ]]

  # The uvx path runs uv under env -i with an allow-list. A caller's
  # named private index has to keep its credentials: uv must send the
  # UV_INDEX_<NAME>_USERNAME and _PASSWORD the caller set ("env" leg),
  # or the password a keyring executable on the caller's PATH returns
  # under UV_KEYRING_PROVIDER=subprocess from a variable the caller
  # exported ("keyring" leg).
  private-index-credentials:
    name: 'Private Index Credentials (${{ matrix.source }})'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        source: [env, keyring]
    steps:
      - name: 'Load egress allow-list (block mode)'
        # yamllint disable-line rule:line-length
        uses: lfreleng-actions/harden-runner-block-action@36a02f4a61b27e7a0a91e1df2134abe9545cf54e  # v0.16.1
        with:
          config: ${{ env.HARDEN_RUNNER_ALLOWLIST }}
          allow_list_summary: 'false'

      - name: 'Harden runner (block)'
        # yamllint disable-line rule:line-length
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43  # v2.22.3
        with:
          egress-policy: 'block'
          allowed-endpoints: >
            ${{ env.CONNECTION_ALLOW_LIST }}

      # A local index that demands Basic authentication, records what it
      # receives, then answers 404 so uv falls through to PyPI. Its
      # /health path is the endpoint the action checks.
      - name: Start a local private index
        run: |
          set -euo pipefail
          server="$RUNNER_TEMP/private-index.py"
          cat > "$server" <<'EOF'
          import http.server
          import sys

          LOG = sys.argv[1]


          class Index(http.server.BaseHTTPRequestHandler):
              def do_GET(self):
                  if self.path == "/health":
                      self.send_response(200)
                      self.end_headers()
                      self.wfile.write(b"ok\n")
                      return
                  auth = self.headers.get("Authorization")
                  with open(LOG, "a") as log:
                      log.write(f"{self.path} {auth}\n")
                  if auth is None:
                      self.send_response(401)
                      self.send_header("WWW-Authenticate", 'Basic realm="private"')
                  else:
                      self.send_response(404)
                  self.end_headers()


          http.server.HTTPServer(("127.0.0.1", 8766), Index).serve_forever()
          EOF
          nohup python3 -I "$server" "$RUNNER_TEMP/private-index-requests" \
            > "$RUNNER_TEMP/private-index.log" 2>&1 &
          for _ in $(seq 1 30); do
            if curl -fsS -o /dev/null http://127.0.0.1:8766/health; then
              exit 0
            fi
            sleep 1
          done
          echo "::error::The local private index did not start"
          cat "$RUNNER_TEMP/private-index.log"
          exit 1

      - name: Configure a named private index, as a caller would
        env:
          SOURCE: ${{ matrix.source }}
        run: |
          set -euo pipefail
          {
            echo "UV_INDEX=private=http://127.0.0.1:8766/simple"
            echo "UV_INDEX_PRIVATE_USERNAME=caller"
          } >> "$GITHUB_ENV"
          if [[ "$SOURCE" == "env" ]]; then
            echo "UV_INDEX_PRIVATE_PASSWORD=private-index-test" \
              >> "$GITHUB_ENV"
            exit 0
          fi
          # A keyring executable outside the system search path, which
          # uv finds only on the caller's PATH. Like a real helper, it
          # reads its secret from a variable the caller exported.
          bin="$RUNNER_TEMP/keyring-bin"
          mkdir -p "$bin"
          cat > "$bin/keyring" <<'EOF'
          #!/bin/sh
          echo "$*" >> "$RUNNER_TEMP/keyring-calls"
          if [ "$1" = get ]; then echo "$INDEX_AUTH_TOKEN"; fi
          EOF
          chmod +x "$bin/keyring"
          echo "$bin" >> "$GITHUB_PATH"
          {
            echo "UV_KEYRING_PROVIDER=subprocess"
            echo "INDEX_AUTH_TOKEN=private-index-test"
          } >> "$GITHUB_ENV"

      - name: Run the action
        id: run
        uses: $/
        with:
          url: 'http://127.0.0.1:8766/health'
          service_name: 'Private Index Test'
          expected_http_code: 200
          retries: 3

      - name: Check that uv sent the caller's credentials
        env:
          HTTP_CODE: ${{ steps.run.outputs.response_http_code }}
          SOURCE: ${{ matrix.source }}
        run: |
          set -euo pipefail
          requests="$RUNNER_TEMP/private-index-requests"
          expected="Basic $(printf '%s' 'caller:private-index-test' | base64)"
          echo "Requests the private index received:"
          cat "$requests" 2>/dev/null || true
          if ! grep -qF " $expected" "$requests" 2>/dev/null; then
            echo "::error::uv did not send the caller's private index" \
              "password (source: $SOURCE)"
            exit 1
          fi
          if [[ "$HTTP_CODE" != "200" ]]; then
            echo "::error::Unexpected response_http_code: '$HTTP_CODE'"
            exit 1
          fi

  # Docker integration test for PRs (using GitHub Action instead of Docker CLI)
  docker-integration-test-pr:
    name: 'Docker Integration Test (PR)'
    runs-on: ubuntu-latest
    needs: [integration-tests, python-build-test, cli-tests, action-tests]
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
    timeout-minutes: 15

    steps:
      - name: 'Load egress allow-list (block mode)'
        # yamllint disable-line rule:line-length
        uses: lfreleng-actions/harden-runner-block-action@36a02f4a61b27e7a0a91e1df2134abe9545cf54e  # v0.16.1
        with:
          config: ${{ env.HARDEN_RUNNER_ALLOWLIST }}
          allow_list_summary: 'false'

      - name: 'Harden runner (block)'
        # yamllint disable-line rule:line-length
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43  # v2.22.3
        with:
          egress-policy: 'block'
          allowed-endpoints: >
            ${{ env.CONNECTION_ALLOW_LIST }}

      # Start go-httpbin service for testing
      - name: Setup go-httpbin service
        id: go-httpbin
        uses: lfreleng-actions/go-httpbin-action@692bf3b759b746041e9cc2eebec5a6006e6d6041  # v0.1.7
        with:
          port: '8080'
          debug: 'true'

      # Test Docker integration via GitHub Action (no Docker CLI dependency)
      - name: Test Docker integration via GitHub Action
        uses: $/
        with:
          url: '${{ steps.go-httpbin.outputs.service-url }}/get'
          service_name: 'Docker Integration Test (PR)'
          expected_http_code: 200
          retries: 3
          ca_bundle_path: '${{ steps.go-httpbin.outputs.ca-cert-path }}'
          debug: true

      # Test additional Docker integration scenarios via GitHub Action
      - name: Test Docker integration with POST
        uses: $/
        with:
          url: '${{ steps.go-httpbin.outputs.service-url }}/post'
          service_name: 'Docker Integration POST Test (PR)'
          http_method: 'POST'
          expected_http_code: 200
          request_body: '{"integration": "test", "pr": true}'
          content_type: 'application/json'
          ca_bundle_path: '${{ steps.go-httpbin.outputs.ca-cert-path }}'
          debug: true

      # Test Docker integration with custom headers
      - name: Test Docker integration with headers
        uses: $/
        with:
          url: '${{ steps.go-httpbin.outputs.service-url }}/headers'
          service_name: 'Docker Integration Headers Test (PR)'
          request_headers: '{"X-Integration-Test": "docker-pr", "X-Test-Type": "headers"}'
          expected_http_code: 200
          ca_bundle_path: '${{ steps.go-httpbin.outputs.ca-cert-path }}'
          debug: true

      # Clean up test containers
      - name: Clean up test containers
        if: always()
        run: |
          docker rm -f go-httpbin || true

  # Comprehensive Docker integration tests (after container pipeline and all other tests)
  docker-integration-test:
    name: 'Docker Integration Test'
    runs-on: ubuntu-latest
    needs: [docker-publish, python-build-test, cli-tests, action-tests]
    if: github.event_name != 'pull_request'
    permissions:
      contents: read
      packages: read  # Pull published container images from GHCR
    timeout-minutes: 15

    steps:
      - name: 'Load egress allow-list (block mode)'
        # yamllint disable-line rule:line-length
        uses: lfreleng-actions/harden-runner-block-action@36a02f4a61b27e7a0a91e1df2134abe9545cf54e  # v0.16.1
        with:
          config: ${{ env.HARDEN_RUNNER_ALLOWLIST }}
          allow_list_summary: 'false'

      - name: 'Harden runner (block)'
        # yamllint disable-line rule:line-length
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43  # v2.22.3
        with:
          egress-policy: 'block'
          allowed-endpoints: >
            ${{ env.CONNECTION_ALLOW_LIST }}

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Set up Docker Buildx
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # Login to Container Registry
      - name: Login to Container Registry
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6  # v4.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Test Docker image functionality
      - name: Test Docker image functionality
        run: |
          IMAGE_TAG="${REGISTRY}/${IMAGE_NAME}:latest"
          echo "Testing published image: $IMAGE_TAG"

          # Test basic help command
          docker run --rm "$IMAGE_TAG" --help

      # Start go-httpbin service for testing
      - name: Setup go-httpbin service
        id: go-httpbin
        uses: lfreleng-actions/go-httpbin-action@692bf3b759b746041e9cc2eebec5a6006e6d6041  # v0.1.7
        with:
          port: '8080'
          debug: 'true'

      - name: Test Docker image with go-httpbin
        run: |
          IMAGE_TAG="${REGISTRY}/${IMAGE_NAME}:latest"
          echo "Using image tag: $IMAGE_TAG"

          # Get service URL and CA bundle from go-httpbin action
          SERVICE_URL="${STEPS_GO_HTTPBIN_OUTPUTS_SERVICE_URL}"
          CA_BUNDLE="${STEPS_GO_HTTPBIN_OUTPUTS_CA_CERT_PATH}"

          # Test the http-api-tool against go-httpbin with HTTPS
          docker run --rm --network host \
            -v "$CA_BUNDLE:/tmp/ca-bundle.pem:ro" \
            "$IMAGE_TAG" \
            test \
            --url "$SERVICE_URL/get" \
            --ca-bundle-path "/tmp/ca-bundle.pem" \
            --debug \
            --retries 3
        env:
          STEPS_GO_HTTPBIN_OUTPUTS_SERVICE_URL: ${{ steps.go-httpbin.outputs.service-url }}
          STEPS_GO_HTTPBIN_OUTPUTS_CA_CERT_PATH: ${{ steps.go-httpbin.outputs.ca-cert-path }}

      - name: Clean up test containers
        if: always()
        run: |
          docker rm -f go-httpbin || true

  # Static analysis the family does not run: bandit over the sources
  # and this repository's pip hash-pinning check
  security-scan:
    name: 'Security Scan'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 10
    steps:
      - name: 'Load egress allow-list (block mode)'
        # yamllint disable-line rule:line-length
        uses: lfreleng-actions/harden-runner-block-action@36a02f4a61b27e7a0a91e1df2134abe9545cf54e  # v0.16.1
        with:
          config: ${{ env.HARDEN_RUNNER_ALLOWLIST }}
          allow_list_summary: 'false'

      - name: 'Harden runner (block)'
        # yamllint disable-line rule:line-length
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43  # v2.22.3
        with:
          egress-policy: 'block'
          allowed-endpoints: >
            ${{ env.CONNECTION_ALLOW_LIST }}

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install UV
        # yamllint disable-line rule:line-length
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock

      # Install project dependencies with dev extras (includes bandit)
      - name: Install project dependencies
        run: |
          echo "Installing project dependencies with dev extras..."
          uv sync --extra dev

      # Check pip install security (SHA pinning)
      - name: Check pip install commands for SHA hash pinning
        run: |
          echo "::group::Pip Install Security Check"
          python3 scripts/check-pip-security.py
          echo "::endgroup::"

      # Run bandit
      - name: Run bandit static code analysis
        run: |
          echo "::group::Bandit Static Analysis"
          uv run bandit -r src/ -c pyproject.toml -ll
          echo "::endgroup::"
