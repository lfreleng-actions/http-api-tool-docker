---
# SPDX-License-Identifier: Apache-2.0
# SPDX-FileCopyrightText: 2025 The Linux Foundation

# Runs on a tag push: builds, tests, audits and scans the Python
# project, promotes the GitHub release, publishes the package to Test
# PyPI and PyPI, then publishes the container image to GHCR.
name: 'Python Build/Test/Release'

# yamllint disable-line rule:truthy
on:
  # Trigger on tag push events
  push:
    tags:
      - '**'

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  # yamllint disable-line rule:line-length
  HARDEN_RUNNER_ALLOWLIST: 'lfreleng-actions//.github/harden-runner/lfreleng-actions/allow_list.txt@6d4a65c5601afd6c2fbe52bda4b0024b132f265d'  # v0.19.0

jobs:
  # Tag validation, Python build (Sigstore-signed, attested), tests,
  # dependency audit, SBOM, Grype scan, artefact attachment and
  # release promotion all come from the python-workflows family. The
  # reusable workflow cannot publish to PyPI (trusted publishing binds
  # to the calling workflow), so the publish jobs follow it here.
  release:
    name: 'Build/Test/Release'
    permissions:
      contents: write       # Create the GitHub release / attach assets
      id-token: write       # OIDC for build provenance attestations
      attestations: write   # Build provenance attestations
    # yamllint disable-line rule:line-length
    uses: lfreleng-actions/python-workflows/.github/workflows/build-test-release.yaml@e6e1ea99f84dc0993a14759c749555268a393cab  # v0.6.0
    with:
      # Grype policy: gate on fixable findings in declared dependencies
      # from medium up, and on critical findings in transitive ones
      grype_only_fixed: true
      grype_dependency_policy: 'declared'
      grype_transitive_fail_on: 'critical'
      # The NO_BLOCK_AUDIT_FAIL repository variable lets a release
      # proceed past a failing dependency audit, as it did before
      audit_permit_fail: ${{ vars.NO_BLOCK_AUDIT_FAIL == 'true' }}

  test-pypi:
    name: 'Test PyPI Publishing'
    runs-on: 'ubuntu-latest'
    needs: 'release'
    environment:
      name: 'development'
    permissions:
      contents: read
      id-token: write  # IMPORTANT: mandatory for trusted publishing
    timeout-minutes: 5
    steps:
      - name: 'Load egress allow-list (block mode)'
        # yamllint disable-line rule:line-length
        uses: lfreleng-actions/harden-runner-block-action@bd83615a22b57835798adcb9ce753161464dfb40  # v0.16.2
        with:
          config: ${{ env.HARDEN_RUNNER_ALLOWLIST }}

      - name: 'Harden runner (block)'
        # yamllint disable-line rule:line-length
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43  # v2.22.3
        with:
          egress-policy: 'block'
          allowed-endpoints: >
            ${{ env.CONNECTION_ALLOW_LIST }}

      - name: 'Test PyPI publishing'
        # yamllint disable-line rule:line-length
        uses: lfreleng-actions/pypi-publish-action@95a73a3d8f8a665d0816d35fcd6a75a2508e9aeb  # v0.2.1
        with:
          environment: 'development'
          tag: "${{ needs.release.outputs.tag }}"
          pypi_credential: "${{ secrets.TEST_PYPI_CREDENTIAL }}"

  pypi:
    name: 'Release PyPI Package'
    runs-on: 'ubuntu-latest'
    needs:
      - 'release'
      - 'test-pypi'
    environment:
      name: 'production'
    permissions:
      contents: read
      id-token: write  # IMPORTANT: mandatory for trusted publishing
    timeout-minutes: 5
    steps:
      - name: 'Load egress allow-list (block mode)'
        # yamllint disable-line rule:line-length
        uses: lfreleng-actions/harden-runner-block-action@bd83615a22b57835798adcb9ce753161464dfb40  # v0.16.2
        with:
          config: ${{ env.HARDEN_RUNNER_ALLOWLIST }}
          allow_list_summary: 'false'

      - name: 'Harden runner (block)'
        # yamllint disable-line rule:line-length
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43  # v2.22.3
        with:
          egress-policy: 'block'
          allowed-endpoints: >
            ${{ env.CONNECTION_ALLOW_LIST }}

      - name: 'PyPI release'
        # yamllint disable-line rule:line-length
        uses: lfreleng-actions/pypi-publish-action@95a73a3d8f8a665d0816d35fcd6a75a2508e9aeb  # v0.2.1
        with:
          environment: 'production'
          attestations: true
          tag: "${{ needs.release.outputs.tag }}"
          pypi_credential: "${{ secrets.PYPI_CREDENTIAL }}"

  # The docker-workflows release lane manages the GitHub release
  # itself (draft check, asset attachment, promotion), so it cannot
  # share a tag with the python-workflows release above. It also
  # publishes a single <version> tag, where this image carries the
  # major and major.minor aliases consumers pin to. This job stays
  # custom until the family can publish an image without owning the
  # release.
  docker-publish:
    name: 'Publish Docker Image'
    runs-on: 'ubuntu-latest'
    needs:
      - 'release'
      - 'test-pypi'
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write  # Push container images to GHCR
    steps:
      - name: 'Load egress allow-list (block mode)'
        # yamllint disable-line rule:line-length
        uses: lfreleng-actions/harden-runner-block-action@bd83615a22b57835798adcb9ce753161464dfb40  # v0.16.2
        with:
          config: ${{ env.HARDEN_RUNNER_ALLOWLIST }}
          allow_list_summary: 'false'

      - name: 'Harden runner (block)'
        # yamllint disable-line rule:line-length
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43  # v2.22.3
        with:
          egress-policy: 'block'
          allowed-endpoints: >
            ${{ env.CONNECTION_ALLOW_LIST }}

      # yamllint disable-line rule:line-length
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        # yamllint disable-line rule:line-length
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1

      - name: Login to Container Registry
        # yamllint disable-line rule:line-length
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6  # v4.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        # yamllint disable-line rule:line-length
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302  # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}},value=${{ needs.release.outputs.tag }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.release.outputs.tag }}
            type=semver,pattern={{major}},value=${{ needs.release.outputs.tag }}
            type=raw,value=latest
          labels: |
            org.opencontainers.image.title=HTTP API Tool
            org.opencontainers.image.description=A Python HTTP/HTTPS API testing tool for GitHub Actions and CLI usage
            org.opencontainers.image.vendor=The Linux Foundation
            org.opencontainers.image.version=${{ needs.release.outputs.tag }}

      - name: Build and push Docker image
        # yamllint disable-line rule:line-length
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: .
          file: ./docker/Containerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ needs.release.outputs.tag }}
          cache-from: |
            type=gha,scope=docker-release
            type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:cache-base
            type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:cache-deps
          cache-to: |
            type=gha,mode=max,scope=docker-release
            type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:cache-base,mode=max
            type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:cache-deps,mode=max

      - name: Verify published image
        run: |
          echo "Docker image published successfully to GHCR"
          echo "Version: ${RELEASE_TAG}"
          echo "Tags: ${IMAGE_TAGS}"
        env:
          RELEASE_TAG: ${{ needs.release.outputs.tag }}
          IMAGE_TAGS: ${{ steps.meta.outputs.tags }}
