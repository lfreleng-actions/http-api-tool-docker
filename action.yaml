---
# SPDX-License-Identifier: Apache-2.0
# SPDX-FileCopyrightText: 2025 The Linux Foundation

# http-api-tool-docker
name: '🛠️ Test API/Service Availability'
description: 'Tests an HTTP/HTTPS API endpoint for service availability'

inputs:
  # Deployment method
  deploy:
    description: 'Deployment method: "uvx" (default, fast) or "docker" (containerized)'
    required: false
    default: 'uvx'
  python_version:
    description: 'Python version (ignored: deploy=uvx runs on a uv-managed Python 3.13)'
    required: false
    default: '3.11'
  use_local_code:
    # Requires package to first be installed with "uv pip install --system -e ."
    description: "Use locally installed package instead of uvx/PyPI"
    required: false
    default: 'false'

  # Mandatory
  url:
    # Example: "http://username:password@127.0.0.1:8080/index.yaml"
    description: 'URL of API server/interface to check'
    required: true
  auth_string:
    # Parsed from the URL string above, but can be provided explicitly
    # Should be in the format used by cURL, e.g. username:password
    # Will be passed to cURL using the flag: curl -c "username:password"
    description: 'Authentication string, colon separated username/password'
    required: false
  service_name:
    # Example: 'ChartMuseum Repository'
    description: 'Name of HTTP/HTTPS API service tested'
    required: false
    default: 'API Service'
  initial_sleep_time:
    description: 'Delay in seconds before the first retry, doubling thereafter'
    required: false
    # Wait a second before the first retry
    default: '1'
  max_delay:
    description: 'Maximum delay in seconds between retries'
    required: false
    default: '30'
  retries:
    description: 'Number of retries before declaring service unavailable'
    required: false
    default: '3'
  expected_http_code:
    description: 'HTTP response code to accept from the API service'
    required: false
    default: '200'
  regex:
    # Extended regular expression; uses grep with the "-E" flag
    description: 'Verify server response with regular expression'
    required: false
  show_header_json:
    description: "Display response header as JSON in action output"
    required: false
    default: 'false'
  curl_timeout:
    description: 'Maximum time in seconds for cURL to wait for a response'
    required: false
    default: '5'
  http_method:
    description: 'HTTP method to use (GET, POST, PUT, etc.)'
    required: false
    default: 'GET'
  request_body:
    description: 'Data to send with POST/PUT/PATCH requests'
    required: false
  content_type:
    description: 'Content type of the request body'
    required: false
    default: 'application/json'
  request_headers:
    description: 'Custom HTTP headers sent in JSON format'
    required: false
  verify_ssl:
    description: 'Verify SSL certificates'
    required: false
    default: 'true'
  ca_bundle_path:
    description: 'Path to CA bundle file for SSL verification'
    required: false
  include_response_body:
    description: 'Include response body in outputs (base64 encoded)'
    required: false
    default: 'false'
  follow_redirects:
    description: 'Follow HTTP redirects'
    required: false
    default: 'true'
  max_response_time:
    description: 'Maximum acceptable response time in seconds'
    required: false
    default: '0'
  connection_reuse:
    description: 'Reuse connections between requests'
    required: false
    default: 'true'
  debug:
    description: 'Enables debugging output'
    required: false
    default: 'false'
  fail_on_timeout:
    description: 'Fail the action if response time exceeds max_response_time'
    required: false
    default: 'false'

outputs:
  time_delay:
    description: 'Number of seconds waiting for service availability/failure'
    value: "${{ steps.uvx-run.outputs.time_delay || steps.docker-run.outputs.time_delay }}"
  response_http_code:
    description: 'HTTP response code received from the server'
    value: "${{ steps.uvx-run.outputs.response_http_code || steps.docker-run.outputs.response_http_code }}"
  response_header_json:
    description: 'HTTP response header as JSON'
    value: "${{ steps.uvx-run.outputs.response_header_json || steps.docker-run.outputs.response_header_json }}"
  response_header_size:
    description: 'HTTP response header size in bytes'
    value: "${{ steps.uvx-run.outputs.response_header_size || steps.docker-run.outputs.response_header_size }}"
  response_body_size:
    description: 'HTTP response body size in bytes'
    value: "${{ steps.uvx-run.outputs.response_body_size || steps.docker-run.outputs.response_body_size }}"
  regex_match:
    description: 'Whether the regular expression matched the server reply'
    value: "${{ steps.uvx-run.outputs.regex_match || steps.docker-run.outputs.regex_match }}"
  response_body_base64:
    description: 'Response body base64 encoded (when include_response_body set)'
    value: "${{ steps.uvx-run.outputs.response_body_base64 || steps.docker-run.outputs.response_body_base64 }}"
  total_time:
    description: 'Total time for the request in seconds'
    value: "${{ steps.uvx-run.outputs.total_time || steps.docker-run.outputs.total_time }}"
  connect_time:
    description: 'Time to establish connection in seconds'
    value: "${{ steps.uvx-run.outputs.connect_time || steps.docker-run.outputs.connect_time }}"
  response_time_exceeded:
    description: 'Whether response time exceeded maximum acceptable time'
    value: "${{ steps.uvx-run.outputs.response_time_exceeded || steps.docker-run.outputs.response_time_exceeded }}"

runs:
  using: 'composite'
  steps:
    # Validate deploy input
    - name: Validate deploy input
      shell: bash
      env:
        INPUT_DEPLOY: ${{ inputs.deploy }}
      run: |
        if [[ "$INPUT_DEPLOY" != "uvx" && "$INPUT_DEPLOY" != "docker" ]]; then
          # Strip CR/LF from the user value so it cannot inject additional
          # workflow commands/annotations into the log command stream.
          deploy_safe="${INPUT_DEPLOY//$'\n'/}"
          deploy_safe="${deploy_safe//$'\r'/}"
          echo "::error::Invalid deploy input: '$deploy_safe'. Must be 'uvx' or 'docker'."
          exit 1
        fi

    # UVX deployment path (default)
    # A composite action inherits the caller job's environment, so no
    # step below may let a caller variable (PATH, UV_PYTHON, VIRTUAL_ENV,
    # CONDA_PREFIX, PYTHON* and the like) choose the interpreter it runs.
    # A caller's UV_NO_MODIFY_PATH would stop setup-uv putting its own
    # uv and tool-bin-dir on PATH, leaving the caller's PATH to choose.
    # No step can unset an inherited variable, so refuse it instead.
    - name: Refuse an inherited UV_NO_MODIFY_PATH
      if: inputs.deploy == 'uvx'
      shell: bash
      run: |
        if [ -n "${UV_NO_MODIFY_PATH+set}" ]; then
          echo "::error::UV_NO_MODIFY_PATH is set in the caller's" \
            "environment; unset it before calling this action."
          exit 1
        fi

    # setup-uv's only uv call for these inputs is "uv python find",
    # whose result it executes. An invalid preference makes uv refuse
    # its arguments before any lookup; setup-uv then reports the
    # Python version as "unknown", which nothing reads.
    - name: Install uv for uvx deployment
      if: inputs.deploy == 'uvx'
      id: setup-uv
      uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
      with:
        working-directory: "${{ github.action_path }}"
        # Without it setup-uv puts the caller's HOME/XDG_* bin dir on PATH
        tool-bin-dir: "${{ runner.temp }}/http-api-tool-docker/bin"
        # The post-step "uv cache prune" would hit the invalid preference
        enable-cache: false
      env:
        UV_NO_CONFIG: '1'
        UV_NO_PROJECT: '1'
        UV_PYTHON_PREFERENCE: 'lookup-disabled'
        # Inherited, it makes setup-uv probe uv, which the line above fails
        UV_PYTHON_ARCH: ''
        UV_PYTHON_INSTALL_DIR: "${{ runner.temp }}/http-api-tool-docker/python"

    # A trusted interpreter: uv installs its own pinned, hash-checked
    # build, then the PyPI release of http-api-tool into an environment
    # on it. uv runs with an empty environment plus an allow-list, so no
    # caller variable can pick or redirect the interpreter or the
    # environment uv installs into. It runs from the action's temporary
    # directory, not the action path: for an action checked out inside
    # the workspace ('uses: ./...'), "uv python find" would otherwise
    # probe a .venv in a parent directory.
    - name: Install Python and http-api-tool for uvx deployment
      if: inputs.deploy == 'uvx' && inputs.use_local_code != 'true'
      id: python
      shell: bash
      env:
        UV: "${{ steps.setup-uv.outputs.uv-path }}"
        WORK_DIR: "${{ runner.temp }}/http-api-tool-docker"
        INSTALL_DIR: "${{ runner.temp }}/http-api-tool-docker/python"
        CACHE_DIR: "${{ runner.temp }}/http-api-tool-docker/cache"
        VENV: "${{ runner.temp }}/http-api-tool-docker/venv"
        PYTHON_VERSION: '3.13'
      run: |
        mkdir -p "$WORK_DIR"
        cd "$WORK_DIR"
        clean=(UV_NO_CONFIG=1 UV_NO_PROJECT=1
          "UV_PYTHON_INSTALL_DIR=$INSTALL_DIR" "UV_CACHE_DIR=$CACHE_DIR")
        # Network settings, and the package index and authentication
        # settings uvx honoured before; none of them chooses an
        # interpreter. The UV_INDEX* names cover UV_INDEX, UV_INDEX_URL,
        # UV_INDEX_STRATEGY and a named index's UV_INDEX_<NAME>_USERNAME
        # and UV_INDEX_<NAME>_PASSWORD.
        for name in HTTP_PROXY HTTPS_PROXY ALL_PROXY NO_PROXY http_proxy \
            https_proxy all_proxy no_proxy SSL_CERT_FILE SSL_CERT_DIR \
            UV_NATIVE_TLS UV_DEFAULT_INDEX UV_EXTRA_INDEX_URL \
            UV_KEYRING_PROVIDER UV_INSECURE_HOST UV_HTTP_TIMEOUT \
            "${!UV_INDEX@}"; do
          if [ -n "${!name+set}" ]; then clean+=("$name=${!name}"); fi
        done
        env -i "${clean[@]}" "$UV" python install --quiet --no-bin \
          "$PYTHON_VERSION"
        PYTHON=$(env -i "${clean[@]}" "$UV" python find --managed-python \
          "$PYTHON_VERSION")
        case "$PYTHON" in
          "$INSTALL_DIR"/*) ;;
          *) echo "Error: uv found Python outside its install directory ❌"
             exit 1 ;;
        esac
        env -i "${clean[@]}" "$UV" venv --no-config --quiet --clear \
          --python "$PYTHON" "$VENV"
        # The keyring executable UV_KEYRING_PROVIDER=subprocess runs needs
        # the caller's PATH, which the action trusts (see the README), and
        # whatever credential or configuration variables it reads. So this
        # call alone keeps the caller's environment, less every UV_*
        # setting outside the allow-list and the variables that point a
        # Python at other code or another prefix. With an absolute
        # --python, none of what remains chooses an interpreter.
        helper=()
        while IFS= read -r name; do
          case "$name" in
            UV_* | PYTHON* | __PYVENV_LAUNCHER__ | VIRTUAL_ENV | CONDA_*) ;;
            *) helper+=("$name=${!name}") ;;
          esac
        done < <(compgen -e)
        env -i "${helper[@]}" "${clean[@]}" "$UV" pip install --no-config \
          --quiet --python "$VENV/bin/python" http-api-tool
        echo "venv-python=$VENV/bin/python" >> "$GITHUB_OUTPUT"

    - name: Run http-api-tool via uvx
      if: inputs.deploy == 'uvx'
      id: uvx-run
      shell: bash
      env:
        INPUT_DEPLOY: ${{ inputs.deploy }}
        INPUT_URL: ${{ inputs.url }}
        INPUT_AUTH_STRING: ${{ inputs.auth_string }}
        INPUT_SERVICE_NAME: ${{ inputs.service_name }}
        INPUT_INITIAL_SLEEP_TIME: ${{ inputs.initial_sleep_time }}
        INPUT_MAX_DELAY: ${{ inputs.max_delay }}
        INPUT_RETRIES: ${{ inputs.retries }}
        INPUT_EXPECTED_HTTP_CODE: ${{ inputs.expected_http_code }}
        INPUT_REGEX: ${{ inputs.regex }}
        INPUT_SHOW_HEADER_JSON: ${{ inputs.show_header_json }}
        INPUT_CURL_TIMEOUT: ${{ inputs.curl_timeout }}
        INPUT_HTTP_METHOD: ${{ inputs.http_method }}
        INPUT_REQUEST_BODY: ${{ inputs.request_body }}
        INPUT_CONTENT_TYPE: ${{ inputs.content_type }}
        INPUT_REQUEST_HEADERS: ${{ inputs.request_headers }}
        INPUT_VERIFY_SSL: ${{ inputs.verify_ssl }}
        INPUT_CA_BUNDLE_PATH: ${{ inputs.ca_bundle_path }}
        INPUT_INCLUDE_RESPONSE_BODY: ${{ inputs.include_response_body }}
        INPUT_FOLLOW_REDIRECTS: ${{ inputs.follow_redirects }}
        INPUT_MAX_RESPONSE_TIME: ${{ inputs.max_response_time }}
        INPUT_CONNECTION_REUSE: ${{ inputs.connection_reuse }}
        INPUT_DEBUG: ${{ inputs.debug }}
        INPUT_FAIL_ON_TIMEOUT: ${{ inputs.fail_on_timeout }}
        INPUT_USE_LOCAL_CODE: ${{ inputs.use_local_code }}
        GITHUB_ACTIONS: 'true'
        GITHUB_OUTPUT: ${{ env.GITHUB_OUTPUT }}
        GITHUB_STEP_SUMMARY: ${{ env.GITHUB_STEP_SUMMARY }}
        PYTHON: "${{ steps.python.outputs.venv-python }}"
      run: |
        if [[ "$INPUT_USE_LOCAL_CODE" == "true" ]]; then
          # The documented contract: the caller installed http-api-tool
          # and chose its interpreter, so it runs as found on PATH.
          if ! command -v http-api-tool &> /dev/null; then
            echo "::error::http-api-tool is not installed." \
              "Please install it first by running 'uv pip install --system -e .'" \
              "from the repository root before using use_local_code: true"
            exit 1
          fi

          echo "::notice::Using locally installed http-api-tool package"
          http-api-tool
        else
          echo "::notice::Using http-api-tool from PyPI via uv"
          # The environment's own interpreter, isolated (-I): it ignores
          # PYTHON* variables, the user site and the working directory.
          # -I does not cover these two: either one replaces the
          # interpreter's own path, and with it the prefix it loads from.
          unset PYTHONEXECUTABLE __PYVENV_LAUNCHER__
          "$PYTHON" -I -m http_api_tool
        fi

    # Docker deployment path
    - name: Build Docker image for docker deployment
      if: inputs.deploy == 'docker'
      shell: bash
      working-directory: ${{ github.action_path }}
      env:
        RUN_ID: ${{ github.run_id }}
      run: |
        # Check if the image already exists (pre-loaded from artifact)
        if docker image inspect "http-api-tool:${RUN_ID}" >/dev/null 2>&1; then
          echo "::notice::Using pre-loaded Docker image http-api-tool:${RUN_ID}"
        else
          echo "::notice::Building Docker image http-api-tool:${RUN_ID}"
          docker build -f docker/Containerfile -t "http-api-tool:${RUN_ID}" .
        fi

    - name: Run http-api-tool via Docker
      if: inputs.deploy == 'docker'
      id: docker-run
      shell: bash
      working-directory: ${{ github.action_path }}
      env:
        INPUT_DEPLOY: ${{ inputs.deploy }}
        INPUT_URL: ${{ inputs.url }}
        INPUT_AUTH_STRING: ${{ inputs.auth_string }}
        INPUT_SERVICE_NAME: ${{ inputs.service_name }}
        INPUT_INITIAL_SLEEP_TIME: ${{ inputs.initial_sleep_time }}
        INPUT_MAX_DELAY: ${{ inputs.max_delay }}
        INPUT_RETRIES: ${{ inputs.retries }}
        INPUT_EXPECTED_HTTP_CODE: ${{ inputs.expected_http_code }}
        INPUT_REGEX: ${{ inputs.regex }}
        INPUT_SHOW_HEADER_JSON: ${{ inputs.show_header_json }}
        INPUT_CURL_TIMEOUT: ${{ inputs.curl_timeout }}
        INPUT_HTTP_METHOD: ${{ inputs.http_method }}
        INPUT_REQUEST_BODY: ${{ inputs.request_body }}
        INPUT_CONTENT_TYPE: ${{ inputs.content_type }}
        INPUT_REQUEST_HEADERS: ${{ inputs.request_headers }}
        INPUT_VERIFY_SSL: ${{ inputs.verify_ssl }}
        INPUT_CA_BUNDLE_PATH: ${{ inputs.ca_bundle_path }}
        INPUT_INCLUDE_RESPONSE_BODY: ${{ inputs.include_response_body }}
        INPUT_FOLLOW_REDIRECTS: ${{ inputs.follow_redirects }}
        INPUT_MAX_RESPONSE_TIME: ${{ inputs.max_response_time }}
        INPUT_CONNECTION_REUSE: ${{ inputs.connection_reuse }}
        INPUT_DEBUG: ${{ inputs.debug }}
        INPUT_FAIL_ON_TIMEOUT: ${{ inputs.fail_on_timeout }}
        GITHUB_ACTIONS: 'true'
        RUN_ID: ${{ github.run_id }}
      run: |
        # Build volume mounts as an array so each '-v' entry is passed as a
        # single quoted argument and cannot inject extra docker flags/mounts.
        VOLUME_MOUNTS=(-v "$GITHUB_OUTPUT:$GITHUB_OUTPUT")

        # Mount CA bundle if specified
        if [ -n "$INPUT_CA_BUNDLE_PATH" ] && [ -f "$INPUT_CA_BUNDLE_PATH" ]; then
          # Reject traversal, shell metacharacters, whitespace, and ':'.
          # ':' is the docker volume field separator, so allowing it would let
          # a caller append extra mount options (e.g. ':rw') or fields;
          # whitespace would break argument boundaries.
          if printf '%s' "$INPUT_CA_BUNDLE_PATH" \
            | grep -qE '\.\.(/|$)|[;|&$`:[:space:]]'; then
            echo "::error::ca_bundle_path contains invalid characters"
            exit 1
          fi
          # Constrain to an allowlist of safe roots: the workspace, the runner
          # temp dir, or standard system CA-certificate locations. This blocks
          # mounting arbitrary sensitive host files (e.g. /etc/shadow) while
          # still supporting genuine CA bundles.
          ca_real="$(readlink -f -- "$INPUT_CA_BUNDLE_PATH")"
          ca_allowed=false
          for root in "$GITHUB_WORKSPACE" "$RUNNER_TEMP" \
            /etc/ssl /etc/pki /etc/ca-certificates \
            /usr/share/ca-certificates /usr/local/share/ca-certificates; do
            [ -n "$root" ] || continue
            root_real="$(readlink -f -- "$root" 2>/dev/null)" || continue
            case "$ca_real/" in
              "$root_real"/*) ca_allowed=true; break ;;
            esac
          done
          if [ "$ca_allowed" != true ]; then
            echo "::error::ca_bundle_path must be within the workspace, the" \
              "runner temp dir, or a standard CA-certificate location"
            exit 1
          fi
          VOLUME_MOUNTS+=(-v "${ca_real}:${ca_real}:ro")
        fi

        docker run --rm \
          --network host \
          -e INPUT_DEPLOY \
          -e INPUT_URL \
          -e INPUT_AUTH_STRING \
          -e INPUT_SERVICE_NAME \
          -e INPUT_INITIAL_SLEEP_TIME \
          -e INPUT_MAX_DELAY \
          -e INPUT_RETRIES \
          -e INPUT_EXPECTED_HTTP_CODE \
          -e INPUT_REGEX \
          -e INPUT_SHOW_HEADER_JSON \
          -e INPUT_CURL_TIMEOUT \
          -e INPUT_HTTP_METHOD \
          -e INPUT_REQUEST_BODY \
          -e INPUT_CONTENT_TYPE \
          -e INPUT_REQUEST_HEADERS \
          -e INPUT_VERIFY_SSL \
          -e INPUT_CA_BUNDLE_PATH \
          -e INPUT_INCLUDE_RESPONSE_BODY \
          -e INPUT_FOLLOW_REDIRECTS \
          -e INPUT_MAX_RESPONSE_TIME \
          -e INPUT_CONNECTION_REUSE \
          -e INPUT_DEBUG \
          -e INPUT_FAIL_ON_TIMEOUT \
          -e GITHUB_ACTIONS \
          -e GITHUB_OUTPUT \
          "${VOLUME_MOUNTS[@]}" \
          "http-api-tool:${RUN_ID}"

    - name: Cleanup Docker image
      if: inputs.deploy == 'docker' && always()
      shell: bash
      env:
        RUN_ID: ${{ github.run_id }}
      run: |
        docker rmi "http-api-tool:${RUN_ID}" || true
